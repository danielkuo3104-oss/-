<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>違規紀錄中心 - 宿舍智慧管理系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --morandi-dark: #8C6A6A;    /* 莫蘭迪深磚紅 */
            --morandi-main: #B58D8D;    /* 莫蘭迪主粉紅 */
            --morandi-light: #F4EAEA;   /* 莫蘭迪淺粉白 */
            --morandi-bg: #F9F6F6;      /* 背景基調 */
            --text-main: #4A3E3E;       /* 主文字色 */
            --border-color: #E2D5D5;    /* 邊框色 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--morandi-bg);
            margin: 0;
            padding: 20px 12px;
            color: var(--text-main);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(140, 106, 106, 0.08);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .header {
            background: linear-gradient(135deg, var(--morandi-dark), var(--morandi-main));
            padding: 30px 20px;
            color: #ffffff;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }
        .header p {
            margin: 8px 0 0 0;
            font-size: 14px;
            color: #fff0f0;
            opacity: 0.9;
        }
        .content {
            padding: 25px 20px;
        }

        /* 篩選與過濾操作區 */
        .filter-section {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
        }
        .filter-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--morandi-dark);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: var(--morandi-dark);
        }
        .roommate-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background-color: var(--morandi-light);
        }
        .filter-btn.active {
            background-color: var(--morandi-dark);
            border-color: var(--morandi-dark);
            color: #ffffff;
        }

        /* 分頁頁籤區塊 */
        .tabs-container {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
            gap: 5px;
        }
        .tab {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            color: #7A6F6F;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
            border: 1px solid transparent;
            margin-bottom: -2px;
        }
        .tab:hover {
            color: var(--morandi-dark);
            background-color: var(--morandi-light);
        }
        .tab.active {
            color: var(--morandi-dark);
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-bottom: 2px solid #ffffff;
        }

        /* 表格控制與手機端橫向滾動優化 */
        .table-panel {
            display: none;
        }
        .table-panel.active {
            display: block;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            table-layout: fixed;
            min-width: 950px;    
        }
        th {
            background-color: #FAF6F6;
            border-bottom: 2px solid var(--morandi-dark);
            padding: 14px 10px;
            font-size: 14px;
            color: var(--morandi-dark);
            font-weight: bold;
        }
        td {
            padding: 14px 10px;
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
            border-bottom: 1px solid #F0E6E6;
        }
        tr.hidden {
            display: none !important;
        }

        /* 文字過長換行直接截斷改為三個點 ... */
        .ellipsis-cell {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .case-id {
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            color: #A36A6A;
            font-weight: bold;
            background-color: var(--morandi-light);
            border: 1px dashed var(--morandi-main);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            white-space: nowrap;
        }
        .law-text {
            color: #8A7E7E;
            font-style: italic;
            font-weight: 500;
        }
        .nowrap {
            white-space: nowrap;
        }
        .loading-text {
            padding: 40px;
            text-align: center;
            font-size: 15px;
            color: var(--morandi-dark);
            font-weight: bold;
        }

        /* 詳細內容點擊按鈕樣式 */
        .btn-detail-link {
            color: #1b65a6;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 1px dashed #1b65a6;
            transition: color 0.2s;
        }
        .btn-detail-link:hover {
            color: var(--morandi-dark);
        }

        /* 下方回到主頁實心按鈕樣式 */
        .btn-home-container {
            text-align: center;
            margin-top: 30px;
        }
        .btn-home {
            display: inline-block;
            background-color: var(--morandi-dark);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(140, 106, 106, 0.2);
            transition: all 0.2s ease-in-out;
            border: 1px solid var(--morandi-dark);
        }
        .btn-home:hover {
            background-color: #765656;
            border-color: #765656;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(140, 106, 106, 0.3);
        }

        /* ─── 狀態顏色指定 ─── */
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            text-align: center;
        }
        /* 嚴格狀態顏色映射 */
        .status-orange { background-color: #FFF0E0; color: #E67E22; }    /* 包含「申覆中」：橘色 */
        .status-blue { background-color: #E1F0FA; color: #1B65A6; }      /* 可申覆：藍色 */
        .status-gray { background-color: #EDEAE9; color: #5A5555; }      /* 已結案：灰色 / 其他未知：灰色 */
        .status-navy { background-color: #E2E8F0; color: #1A365D; }      /* 疑義案件：藏青色 */
        .status-red { background-color: #FCE8E6; color: #C5221F; }       /* 駁回 */
        .status-green { background-color: #E6F4EA; color: #137333; }     /* 已撤銷 */

        /* ─── 彈出視窗 (Modal Lightbox) ─── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(74, 62, 62, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: all 0.25s ease-in-out;
        }
        .modal-overlay.active {
            opacity: 1; visibility: visible;
        }
        .modal-box {
            background-color: #ffffff;
            width: 92%;
            max-width: 540px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.25s ease-in-out;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-header {
            background-color: #FAF6F6;
            padding: 16px 20px;
            font-weight: bold;
            color: var(--morandi-dark);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-close {
            background: none; border: none; font-size: 20px;
            color: #7A6F6F; cursor: pointer; line-height: 1;
        }
        .modal-body {
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-main);
            max-height: 75vh;
            overflow-y: auto;
        }
        .modal-field {
            margin-bottom: 14px;
        }
        .modal-title-label {
            font-weight: bold;
            color: var(--morandi-dark);
            font-size: 13px;
            margin-bottom: 4px;
        }
        /* 🎯 找到 .modal-value 區塊並加上 white-space 設定 */
        .modal-value {
            background-color: #FAF6F6;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #F0E6E6;
            word-break: break-all;
            white-space: pre-line; /* 👈 🎯 關鍵修正：讓 HTML 能夠識別並自動渲染 \n 換行 */
        }
        
        /* 憑證外跳連結樣式 */
        .voucher-link-block {
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .voucher-link-text {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
        }
        .voucher-go-btn {
            color: #1b65a6;
            text-decoration: underline;
            font-weight: bold;
        }
        .voucher-go-btn:hover {
            color: var(--morandi-dark);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>違規紀錄中心</h1>
        <p>宿舍智慧管理系統 • 雲端數據即時連動中心</p>
    </div>

    <div class="content">
        <div class="filter-section">
            <div class="filter-title">案件多維度過濾（支援即時連動）</div>
            <div class="search-container">
                <input type="text" id="keywordSearch" class="search-input" placeholder="輸入關鍵字搜尋（案號、法源、說明事由...）" oninput="filterData()">
            </div>
            <div class="roommate-filters">
                <button class="filter-btn active" id="btn-all" onclick="filterRoommate('全部', 'btn-all')">全部成員</button>
                <button class="filter-btn" id="btn-gk" onclick="filterRoommate('洪健棋', 'btn-gk')">洪健棋 (GK)</button>
                <button class="filter-btn" id="btn-dc" onclick="filterRoommate('郭丹騏', 'btn-dc')">郭丹騏 (DC)</button>
                <button class="filter-btn" id="btn-yh" onclick="filterRoommate('尹奕竤', 'btn-yh')">尹奕竤 (YH)</button>
                <button class="filter-btn" id="btn-yl" onclick="filterRoommate('林易諒', 'btn-yl')">林易諒 (YL)</button>
            </div>
        </div>

        <div class="tabs-container">
            <div class="tab active" id="tab-records" onclick="switchTab('records')">違規紀錄</div>
            <div class="tab" id="tab-appeals" onclick="switchTab('appeals')">申覆紀錄</div>
        </div>

        <div class="table-panel active" id="panel-records">
            <div class="table-responsive">
                <table id="recordsTable">
                    <thead>
                        <tr>
                            <th style="width: 16%;">案件序號</th>
                            <th style="width: 11%;">立案日期</th>
                            <th style="width: 10%;">違規人</th>
                            <th style="width: 26%;">違規法源</th>
                            <th style="width: 11%;">處分結果</th>
                            <th style="width: 11%; text-align: center;">當前狀態</th>
                            <th style="width: 14%; text-align: center;">內容詳情</th>
                            <th style="width: 11%;">備註</th> </tr>
                    </thead>
                    <tbody id="recordsBody">
                        <tr><td colspan="8" class="loading-text">正在即時讀取雲端 CSV 對帳紀錄中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="table-panel" id="panel-appeals">
            <div class="table-responsive">
                <table id="appealsTable">
                    <thead>
                        <tr>
                            <th style="width: 16%;">案件序號</th>
                            <th style="width: 10%;">申覆人</th>
                            <th style="width: 11%;">申覆日期</th>
                            <th style="width: 32%;">申覆說明事實</th>
                            <th style="width: 12%; text-align: center;">申覆結果</th>
                            <th style="width: 15%; text-align: center;">檔案詳情</th>
                            <th style="width: 10%;">核覆人</th>
                        </tr>
                    </thead>
                    <tbody id="appealsBody">
                        <tr><td colspan="7" class="loading-text">正在即時讀取雲端 CSV 申覆紀錄中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="btn-home-container">
            <a href="index.html" class="btn-home">回到智慧管理主頁</a>
        </div>
    </div>
</div>

<div class="modal-overlay" id="voucherModal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="modalTitle">詳細案情資訊庫</span>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkqhXCPp4XiHKCEpI3pz4pzcu3sQreQ_qNRLger00ULCHFr9cTbXHMQqAfk7dLa_gUBAIBSJ5sZM4F/pub?gid=96305738&single=true&output=csv";

    let currentRoommate = "全部";
    let activeTab = "records";

    document.addEventListener("DOMContentLoaded", function() {
        fetch(csvUrl)
            .then(response => response.text())
            .then(csvText => {
                Papa.parse(csvText, {
                    complete: function(results) {
                        parseAndRenderData(results.data);
                    },
                    error: function(err) {
                        document.getElementById("recordsBody").innerHTML = `<tr><td colspan="8" class="loading-text" style="color:red;">CSV 解析失敗: ${err.message}</td></tr>`;
                    }
                });
            })
            .catch(error => {
                document.getElementById("recordsBody").innerHTML = `<tr><td colspan="8" class="loading-text" style="color:red;">無法與 Google 雲端連線: ${error}</td></tr>`;
            });
    });

    function getRecordBadgeClass(status) {
        status = status.trim();
        // 1. 優先精確攔截文字中包涵「申覆中」的任何衍生狀態（如：申覆中/值日暫停）
        if (status.indexOf("申覆中") !== -1) return "status-orange";
        
        // 2. 其餘狀態條件嚴格比對
        if (status === "可申覆" || status === "成案/可申覆") return "status-blue";
        if (status === "已結案" || status === "已結案(申覆失敗)") return "status-gray";
        if (status === "疑義案件" || status === "成案/疑義案件") return "status-navy";
        if (status === "駁回") return "status-red";
        if (status === "已撤銷") return "status-green";
        
        // 3. 其他未知原因或未列出之狀態一律保底歸入灰色
        return "status-gray";
    }

    function getAppealBadgeClass(status) {
        status = status.trim();
        if (status.includes("駁回") || status.includes("失敗") || status.includes("不成立")) return "status-red";
        if (status.includes("通過") || status.includes("撤銷") || status.includes("成立")) return "status-green";
        return "status-orange";
    }

    // 🎯 新增：依照序號第 5,6 碼英文簡碼判斷姓名
    function getAppealerName(caseId) {
        if (!caseId || caseId.length < 6) return "--";
        const code = caseId.substring(4, 6).toUpperCase(); // 擷取第 5, 6 碼 (索引值 4 和 5)
        const mapping = {
            "GK": "洪健棋",
            "DC": "郭丹騏",
            "YH": "尹奕竤",
            "YL": "林易諒"
        };
        return mapping[code] || "--";
    }

    function buildVoucherLinkHtml(url, index) {
        url = url.trim();
        if (!url || url === "-" || url === "系統自動") return "";
        
        if (url.substring(0, 4) === "http") {
            return `<div class="voucher-link-block">
                <div class="voucher-link-text">審查憑證附件紀錄 (${index})</div>
                <a href="${url}" target="_blank" class="voucher-go-btn">點此檢視憑證檔案庫 ↗</a>
            </div>`;
        } else {
            return `<div class="voucher-link-block">
                <div class="voucher-link-text">審查憑證附件紀錄 (${index})</div>
                <span style="color:#7A6F6F; font-style:italic; font-size:13px;">${url}</span>
            </div>`;
        }
    }

    function openDetailModal(caseId, mode, mainText, extraText, v1, v2, v3, noteOrDate, appealReply) {
        const modal = document.getElementById("voucherModal");
        const title = document.getElementById("modalTitle");
        const body = document.getElementById("modalBody");

        title.innerText = `案件號 [${caseId}] - 詳細內容與證據檢視`;
        
        let htmlContent = "";

        if (mode === 'record') {
            htmlContent = `
                <div class="modal-field">
                    <div class="modal-title-label">完整違規法源事由</div>
                    <div class="modal-value">${mainText || "無事由說明"}</div>
                </div>
                <div class="modal-field">
                    <div class="modal-title-label">處分結果明細</div>
                    <div class="modal-value">${extraText || "無處分結果資訊"}</div>
                </div>
                <div class="modal-field">
                    <div class="modal-title-label">管理審查備註說明</div>
                    <div class="modal-value">${noteOrDate || "- 無特別備註紀錄 -"}</div>
                </div>
            `;
        } else {
            htmlContent = `
                <div class="modal-field">
                    <div class="modal-title-label">完整申覆說明事實</div>
                    <div class="modal-value">${mainText || "無事實說明"}</div>
                </div>
                <div class="modal-field">
                    <div class="modal-title-label">申覆核覆日期</div>
                    <div class="modal-value">${noteOrDate || "- 暫無核覆日期紀錄 -"}</div>
                </div>
                <div class="modal-field">
                    <div class="modal-title-label">核覆意見與決議說明</div>
                    <div class="modal-value">${appealReply || "- 審查小組評估中 -"}</div>
                </div>
            `;
        }

        let vouchersHtml = "";
        vouchersHtml += buildVoucherLinkHtml(v1, 1);
        vouchersHtml += buildVoucherLinkHtml(v2, 2);
        vouchersHtml += buildVoucherLinkHtml(v3, 3);

        htmlContent += `<div style="margin-top: 18px; border-top: 1px dashed #E2D5D5; padding-top: 14px;">
                            <div style="font-weight:bold; color:#A36A6A; font-size:13px; margin-bottom:4px;">關聯審查證據 / 違規憑證庫</div>`;
        
        if (vouchersHtml !== "") {
            htmlContent += vouchersHtml;
        } else {
            htmlContent += `<div class="modal-value" style="color: #a0aec0; text-align: center; font-style: italic;">- 系統自動核算或暫無附加憑證檔案 -</div>`;
        }
        htmlContent += `</div>`;

        body.innerHTML = htmlContent;
        modal.classList.add("active");
    }

    function closeModal() {
        document.getElementById("voucherModal").classList.remove("active");
    }

    function parseAndRenderData(dataRows) {
        const recordsBody = document.getElementById("recordsBody");
        const appealsBody = document.getElementById("appealsBody");
        
        let recordsHtml = "";
        let appealsHtml = "";

        for (let i = 2; i < dataRows.length; i++) {
            const row = dataRows[i];
            if (!row || row.length < 2) continue;

            // ─── 違規處分對齊 ───
            const caseId = row[0] ? row[0].toString().trim() : "";
            const dateStr = row[1] ? row[1].toString().trim() : "";
            const name = row[2] ? row[2].toString().trim() : "";
            const law = row[4] ? row[4].toString().trim() : "";
            
            const rv1 = row[6] ? row[6].toString().trim() : ""; 
            const rv2 = row[7] ? row[7].toString().trim() : ""; 
            const rv3 = row[8] ? row[8].toString().trim() : ""; 
            
            const resultText = row[9] ? row[9].toString().trim() : "";  
            const status = row[10] ? row[10].toString().trim() : "";    
            const noteText = row[11] ? row[11].toString().trim() : "";  

            if (caseId !== "" && name !== "") {
                const safeLaw = law.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeResult = resultText.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeNote = noteText.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeRv1 = rv1.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeRv2 = rv2.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeRv3 = rv3.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');

                recordsHtml += `<tr data-user="${name}">
                    <td><div class="case-id">${caseId}</div></td>
                    <td class="nowrap">${dateStr}</td>
                    <td class="nowrap">${name}</td>
                    <td class="law-text ellipsis-cell">${law}</td>
                    <td class="ellipsis-cell">${resultText}</td>
                    <td style="text-align: center;"><span class="badge ${getRecordBadgeClass(status)}">${status}</span></td>
                    <td style="text-align: center;">
                        <span class="btn-detail-link" onclick="openDetailModal('${caseId}', 'record', \`${safeLaw}\`, \`${safeResult}\`, \`${safeRv1}\`, \`${safeRv2}\`, \`${safeRv3}\`, \`${safeNote}\`, '')">詳細內容</span>
                    </td>
                    <td class="ellipsis-cell">${noteText ? noteText : "-"}</td>
                </tr>`;
            }

            // ─── 申覆申請對齊 ───
            const appealCaseId = row[12] ? row[12].toString().trim() : "";
            const appealDate = row[13] ? row[13].toString().trim() : "";
            const appealDesc = row[14] ? row[14].toString().trim() : "";
            
            const av1 = row[15] ? row[15].toString().trim() : ""; 
            const av2 = row[16] ? row[16].toString().trim() : ""; 
            const av3 = row[17] ? row[17].toString().trim() : ""; 
            
            const appealResult = row[18] ? row[18].toString().trim() : ""; 
            const approver = row[19] ? row[19].toString().trim() : ""; 
            
            const replyDate = row[20] ? row[20].toString().trim() : "";  
            const replyDesc = row[21] ? row[21].toString().trim() : "";  

            if (appealCaseId !== "" && appealDate !== "") {
                // 🎯 修正：申覆人名稱不再盲目抓 name (row[2])，改經由 getAppealerName 判斷
                const appealerName = getAppealerName(appealCaseId);

                const safeDesc = appealDesc.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeReplyDate = replyDate.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeReplyDesc = replyDesc.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeAv1 = av1.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeAv2 = av2.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
                const safeAv3 = av3.replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');

                // 🎯 修正：data-user 屬性改綁定 appealerName，以利上方「成員按鈕篩選」功能可以正確與之連動
                appealsHtml += `<tr data-user="${appealerName}">
                    <td><div class="case-id">${appealCaseId}</div></td>
                    <td class="nowrap">${appealerName}</td>
                    <td class="nowrap">${appealDate}</td>
                    <td class="ellipsis-cell">${appealDesc}</td>
                    <td style="text-align: center;"><span class="badge ${getAppealBadgeClass(appealResult)}">${appealResult}</span></td>
                    <td style="text-align: center;">
                        <span class="btn-detail-link" onclick="openDetailModal('${appealCaseId}', 'appeal', \`${safeDesc}\`, '', \`${safeAv1}\`, \`${safeAv2}\`, \`${safeAv3}\`, \`${safeReplyDate}\`, \`${safeReplyDesc}\`)">詳細內容</span>
                    </td>
                    <td class="nowrap">${approver ? approver : "-"}</td>
                </tr>`;
            }
        }

        recordsBody.innerHTML = recordsHtml || '<tr><td colspan="8" class="loading-text">目前尚無任何違規紀錄。</td></tr>';
        appealsBody.innerHTML = appealsHtml || '<tr><td colspan="7" class="loading-text">目前尚無任何申覆申請。</td></tr>';
    }

    function switchTab(tabName) {
        activeTab = tabName;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.table-panel').forEach(p => p.classList.remove('active'));
        
        document.getElementById(`tab-${tabName}`).classList.add('active');
        document.getElementById(`panel-${tabName}`).classList.add('active');
        filterData();
    }

    function filterRoommate(name, btnId) {
        currentRoommate = name;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(btnId).classList.add('active');
        filterData();
    }

    function filterData() {
        const keyword = document.getElementById("keywordSearch").value.toLowerCase().trim();
        const targetTableId = activeTab === "records" ? "recordsTable" : "appealsTable";
        const rows = document.querySelectorAll(`#${targetTableId} tbody tr`);

        rows.forEach(row => {
            const userAttr = row.getAttribute("data-user");
            const rowText = row.innerText.toLowerCase();
            if (!userAttr) return;

            const matchUser = (currentRoommate === "全部" || userAttr === currentRoommate);
            const matchKeyword = (keyword === "" || rowText.includes(keyword));

            if (matchUser && matchKeyword) {
                row.classList.remove("hidden");
            } else {
                row.classList.add("hidden");
            }
        });
    }
</script>
</body>
</html>
