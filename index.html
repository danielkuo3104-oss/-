<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍智慧管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'PingFang TC', 'SF Pro Display', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f3f4f9 0%, #e8ebf5 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: #2d3748;
        }
        .header-banner {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 40px 24px 60px 24px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.15);
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-banner h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header-banner p {
            margin: 8px 0 0 0;
            opacity: 0.8;
            font-size: 14px;
        }
        .main-container {
            max-width: 1200px;
            margin: -30px auto 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 30px 0 15px 0;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(160, 174, 192, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(160, 174, 192, 0.2);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: #7c3aed;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stat-card:hover::before {
            opacity: 1;
        }
        .stat-label {
            font-size: 14px;
            color: #718096;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: #1a202c;
        }
        .stat-sub {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 6px;
        }
        .stat-card.highlight {
            background: linear-gradient(135deg, #ffffff 0%, #f5f3ff 100%);
            border: 1px solid rgba(124, 58, 237, 0.2);
        }
        .stat-card.highlight .stat-value {
            color: #4f46e5;
        }
        .chart-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(160, 174, 192, 0.1);
            margin-bottom: 30px;
        }
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #7c3aed;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <div class="header-container">
            <h1>🏢 宿舍智慧管理系統</h1>
            <p>🔄 資料已即時高度連結 Google 試算表後台</p>
        </div>
    </div>

    <div class="main-container" id="mainContent">
        <div class="loading">📊 智慧讀取雲端試算表資料中...</div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/1-vQkqhXCPp4XiHKCEpI3pz4pzcu3sQreQ_qNRLger00ULCHFr9cTbXHMQqAfk7dLa_gUBAIBSJ5sZM4F/gviz/tq?tqx=out:csv";

        async function initDashboard() {
            try {
                const response = await fetch(csvUrl);
                const csvText = await response.text();
                const data = parseCSV(csvText);
                
                if (data.length === 0) throw new Error("無資料");

                let totalWater = 0;
                let totalElectricity = 0;
                let historyTotal = 0;
                const labels = [];
                const monthlyTotals = [];

                data.forEach(row => {
                    const water = parseFloat(row['水費']) || 0;
                    const electricity = parseFloat(row['電費']) || 0;
                    const monthlySum = water + electricity;

                    totalWater += water;
                    totalElectricity += electricity;
                    historyTotal += monthlySum;

                    labels.push(row['月份'] || '未知月份');
                    monthlyTotals.push(monthlySum);
                });

                const latestRow = data[data.length - 1];
                const currentMonth = latestRow['月份'] || '無資料';
                const currentWater = parseFloat(latestRow['水費']) || 0;
                const currentElectricity = parseFloat(latestRow['電費']) || 0;
                const currentTotal = currentWater + currentElectricity;

                const container = document.getElementById('mainContent');
                container.innerHTML = `
                    <div class="section-title">✨ 當月費用摘要 (${currentMonth})</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">⚡ 當月電費</div>
                            <div class="stat-value">NT$ ${currentElectricity.toLocaleString()}</div>
                            <div class="stat-sub">Google 試算表同步</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">💧 當月水費</div>
                            <div class="stat-value">NT$ ${currentWater.toLocaleString()}</div>
                            <div class="stat-sub">Google 試算表同步</div>
                        </div>
                        <div class="stat-card highlight">
                            <div class="stat-label">💰 當月總和</div>
                            <div class="stat-value">NT$ ${currentTotal.toLocaleString()}</div>
                            <div class="stat-sub">水費 + 電費合計</div>
                        </div>
                    </div>

                    <div class="section-title">📈 歷年累積統計</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">⏳ 歷年電費總計</div>
                            <div class="stat-value" style="color: #e11d48;">NT$ ${totalElectricity.toLocaleString()}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">🌊 歷年水費總計</div>
                            <div class="stat-value" style="color: #0284c7;">NT$ ${totalWater.toLocaleString()}</div>
                        </div>
                        <div class="stat-card highlight" style="background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%); border-color: rgba(34, 197, 94, 0.2);">
                            <div class="stat-label">📊 歷年費用總加總</div>
                            <div class="stat-value" style="color: #16a34a;">NT$ ${historyTotal.toLocaleString()}</div>
                        </div>
                    </div>

                    <div class="section-title">📊 歷年總費用趨勢折線圖 (加總)</div>
                    <div class="chart-card">
                        <div class="chart-container">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                `;

                const ctx = document.getElementById('trendChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '每月總費用 (水+電)',
                            data: monthlyTotals,
                            borderColor: '#7c3aed',
                            backgroundColor: 'rgba(124, 58, 237, 0.06)',
                            borderWidth: 3,
                            pointBackgroundColor: '#4f46e5',
                            pointBorderColor: '#ffffff',
                            pointBorderWidth: 2,
                            pointRadius: 5,
                            pointHoverRadius: 7,
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: {
                                grid: { color: '#edf2f7' },
                                ticks: {
                                    callback: function(value) { return 'NT$ ' + value.toLocaleString(); },
                                    font: { family: 'PingFang TC' }
                                }
                            },
                            x: { grid: { display: false } }
                        }
                    }
                });

            } catch (error) {
                console.error("初始化失敗:", error);
                document.getElementById('mainContent').innerHTML = `
                    <div class="loading" style="color: #e53e3e;">
                        ❌ 系統載入失敗。<br>
                        <span style="font-size:13px; color:#718096; display:inline-block; margin-top:10px;">
                            請確認 Google 試算表的欄位標頭是否精確命名為「月份」、「電費」、「水費」(直式架構)。
                        </span>
                    </div>`;
            }
        }

        function parseCSV(text) {
            // 先把整篇文字中所有看不見的 \r 換行雜質全部消滅
            const cleanText = text.replace(/\r/g, "");
            const lines = cleanText.split("\n").map(line => line.trim()).filter(line => line);
            if(lines.length === 0) return [];
            
            // 讀取第一列欄位名稱，並自動去掉 UTF-8 BOM 以及所有干擾的雙引號 ""
            const headers = lines[0].split(",").map(h => h.replace(/^\uFEFF/, '').replace(/["']/g, '').trim());
            
            return lines.slice(1).map(line => {
                const values = line.split(",").map(v => v.replace(/["']/g, '').trim());
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header] = values[index] ? values[index] : "";
                });
                return obj;
            });
        }

        initDashboard();
    </script>
</body>
</html>
