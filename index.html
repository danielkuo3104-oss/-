<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍智慧管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 🎨 全面融入莫蘭迪（Morandi）高級色系調色盤 */
        body {
            font-family: 'PingFang TC', 'SF Pro Display', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f4f5f7 0%, #eaecef 100%);
            margin: 0; padding: 0; min-height: 100vh; color: #4a515a;
        }
        .header-banner {
            background: linear-gradient(135deg, #69779b 0%, #8696b8 100%);
            color: white; padding: 45px 24px 65px 24px; text-align: left;
            box-shadow: 0 4px 20px rgba(105, 119, 155, 0.15);
            position: relative; /* 為了讓更新時間絕對定位 */
        }
        .header-container { max-width: 1200px; margin: 0 auto; position: relative; }
        .header-banner h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1.5px; color: #f4f5f7; }
        .header-banner p { margin: 10px 0 0 0; opacity: 0.85; font-size: 13px; letter-spacing: 0.5px; }
        
        /* 🕒 頂部 Banner 右下角的資料更新時間樣式 */
        .update-time-tag {
            position: absolute; right: 0; bottom: -45px; font-size: 11px;
            color: rgba(255, 255, 255, 0.75); background: rgba(0, 0, 0, 0.12);
            padding: 4px 10px; border-radius: 20px; font-weight: 500;
            letter-spacing: 0.5px; backdrop-filter: blur(4px);
        }

        /* 公告欄跑馬燈 */
        .marquee-wrapper {
            background: #ffffff; border-bottom: 1px solid #e1e4e8; height: 44px;
            overflow: hidden; position: relative; display: flex; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .marquee-title {
            position: absolute; left: 0; top: 0; bottom: 0; background: #7a828a;
            color: #ffffff; padding: 0 16px; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; z-index: 10; letter-spacing: 1px;
        }
        .marquee-content {
            display: flex; white-space: nowrap; position: absolute; left: 100%;
            animation: marquee linear infinite; padding-left: 20px;
        }
        @keyframes marquee {
            0% { left: 100%; transform: translate3d(0,0,0); }
            100% { left: 0; transform: translate3d(-100%,0,0); }
        }
        .announcement-item { display: inline-flex; align-items: center; margin-right: 50px; font-size: 13px; font-weight: 500; }
        .badge { padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-right: 8px; }
        .badge.緊急 { background: #d96b6b; color: white; animation: pulse 1s infinite alternate; }
        .badge.重要 { background: #d9886b; color: white; }
        .badge.普通 { background: #cbd1d6; color: #5a6168; }
        .text-緊急 { color: #b54a4a; font-weight: 700; }
        .text-重要 { color: #b56a4a; }
        .text-普通 { color: #5a6168; }
        @keyframes pulse { 0% { opacity: 1; } 100% { opacity: 0.6; } }

        .main-container { max-width: 1200px; margin: 0 auto 40px auto; padding: 0 20px; box-sizing: border-box; }
        
        /* 標題與空間留白 */
        .section-title { 
            font-size: 16px; 
            font-weight: 600; 
            color: #626973; 
            letter-spacing: 1px; 
            margin: 42px 0 18px 0; 
            display: block;
        }
        
        .chart-header-row { display: flex; justify-content: space-between; align-items: center; margin: 0; }
        
        /* 莫蘭迪圖表切換按鈕 */
        .toggle-btn-group { display: flex; background: #e2e6ea; padding: 3px; border-radius: 10px; border: 1px solid #d1d5db; }
        .toggle-btn { background: transparent; border: none; padding: 6px 14px; font-size: 12px; font-weight: 600; color: #626973; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .toggle-btn.active { background: #ffffff; color: #4a515a; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

        /* 卡片網格 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 0; }
        
        /* 基礎卡片樣式 */
        .stat-card {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-radius: 20px; padding: 24px;
            box-shadow: 0 8px 20px rgba(140, 149, 159, 0.08); border: 1px solid rgba(255, 255, 255, 0.7);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease; position: relative; cursor: pointer;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(140, 149, 159, 0.15); }
        .stat-label { font-size: 13px; color: #8a929a; margin-bottom: 10px; font-weight: 500; letter-spacing: 0.5px; }
        .stat-value { font-size: 24px; font-weight: 700; color: #3a414a; }
        .stat-sub { font-size: 12px; color: #9ba3ab; margin-top: 8px; line-height: 1.5; }
        
        /* 當月卡片 */
        .stat-card.current-ele { background: linear-gradient(135deg, #ffffff 0%, #fdf6f0 100%); border: 1px solid rgba(217, 119, 54, 0.15); }
        .stat-card.current-ele .stat-value { color: #d97736; }
        
        .stat-card.current-water { background: linear-gradient(135deg, #ffffff 0%, #edf3f7 100%); border: 1px solid rgba(82, 121, 150, 0.18); }
        .stat-card.current-water .stat-value { color: #527996; }
        
        .stat-card.current-total { background: linear-gradient(135deg, #ffffff 0%, #f3f6f3 100%); border: 1px solid rgba(110, 145, 110, 0.15); }
        .stat-card.current-total .stat-value { color: #6e916e; }

        /* 歷年累積卡片 */
        .stat-card.history-card { background: #ffffff; border: 1px solid #e1e4e8; }
        .stat-card.history-card .stat-value { color: #4a515a; }

        .chart-card { background: #ffffff; border-radius: 20px; padding: 24px; box-shadow: 0 8px 20px rgba(140, 149, 159, 0.08); border: 1px solid #e1e4e8; margin-bottom: 0; }
        .chart-container { position: relative; height: 350px; width: 100%; }
        
        /* 歷月電表抄錄 */
        .gray-section { background: #e6ebf0; border-radius: 24px; padding: 24px; margin-top: 45px; border: 1px solid #d2dae2; }
        .gray-title { color: #54606e; font-size: 15px; font-weight: 600; margin-bottom: 16px; letter-spacing: 0.5px; }
        .gray-card { background: #f5f8fa; border-radius: 16px; padding: 20px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.01); border: 1px solid #dbe2e8; }

        .rules-card { background: #ffffff; border-radius: 20px; padding: 26px; box-shadow: 0 8px 20px rgba(140, 149, 159, 0.08); border: 1px solid #e1e4e8; margin-bottom: 40px; }
        .rules-list { margin: 0; padding-left: 20px; color: #626973; line-height: 1.8; font-size: 13px; }
        .rules-list li { margin-bottom: 10px; }

        /* 彈窗 UI */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(58, 65, 74, 0.35);
            backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box {
            background: #ffffff; width: 90%; max-width: 420px; border-radius: 28px; padding: 30px;
            box-shadow: 0 20px 45px rgba(58, 65, 74, 0.15); transform: translateY(25px);
            transition: transform 0.3s ease; max-height: 80vh; overflow-y: auto; border: 1px solid #e1e4e8;
        }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        .modal-title { font-size: 20px; font-weight: 700; color: #5a6578; margin-bottom: 22px; letter-spacing: 0.5px; }
        .modal-item-block { border-bottom: 1px solid #f0f2f5; padding: 16px 0; }
        .modal-item-block:last-child { border-bottom: none; }
        .modal-month-title { font-size: 16px; font-weight: 700; color: #69779b; margin-bottom: 12px; }
        .modal-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
        .modal-row-label { color: #828a95; font-weight: 500; }
        .modal-row-value { color: #4a515a; font-weight: 600; }
        .modal-row.total-line { border-top: 1px dashed #e1e4e8; margin-top: 12px; padding-top: 12px; }
        .modal-row.total-line .modal-row-label { color: #4a515a; font-weight: 600; }
        .modal-row.total-line .modal-row-value { color: #69779b; font-size: 16px; font-weight: 700; }
        
        .impute-note { font-size: 11px; color: #769476; opacity: 0.9; font-weight: 400; text-align: left; margin-top: 6px; line-height: 1.4; background: #f3f7f3; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(110, 145, 110, 0.1); }

        .close-btn { background: #f0f2f5; color: #626973; border: none; width: 100%; padding: 14px; border-radius: 14px; font-weight: 600; margin-top: 20px; cursor: pointer; transition: background 0.2s; }
        .close-btn:hover { background: #e6ebf0; }
        .copyright { text-align: center; color: #b2b9c0; font-size: 11px; padding-bottom: 30px; letter-spacing: 1px; }
        .loading { text-align: center; padding: 40px; font-size: 14px; color: #8696b8; font-weight: 500; }

        /* 📱【手機端 RWD 空間優化】 */
        @media (max-width: 768px) {
            .header-banner { padding: 35px 20px 45px 20px; }
            .header-banner h1 { font-size: 22px; }
            .update-time-tag { bottom: -28px; right: 20px; font-size: 10px; padding: 3px 8px; }
            .main-container { padding: 0 16px; margin-bottom: 25px; }
            
            .section-title { margin: 38px 0 16px 0; font-size: 15px; }
            .stats-grid { gap: 28px; }
            .stat-card { padding: 20px; border-radius: 18px; box-shadow: 0 6px 16px rgba(140, 149, 159, 0.06); }
            .stat-value { font-size: 22px; }
            
            .chart-header-row { flex-direction: column; align-items: flex-start; gap: 12px; margin: 0; }
            .chart-header-row .section-title { margin-bottom: 0; }
            .chart-card { padding: 16px; border-radius: 18px; margin-top: 16px; }
            .chart-container { height: 280px; }
            
            .gray-section { padding: 16px; border-radius: 20px; margin-top: 40px; }
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <div class="header-container">
            <h1>宿舍智慧管理系統</h1>
            <p>新竹市東區建功一路47巷五樓（孟竹國宅）</p>
            <div class="update-time-tag" id="updateTimeDisplay">資料更新：同步中...</div>
        </div>
    </div>

    <div class="marquee-wrapper" id="marqueeBar" style="display:none;">
        <div class="marquee-title">公告欄</div>
        <div class="marquee-content" id="marqueeContent"></div>
    </div>

    <div class="main-container">
        <div id="mainContent">
            <div class="loading">智慧建構莫蘭迪看板中...</div>
        </div>
    </div>
    
    <div class="main-container">
        <div class="section-title">宿舍規範</div>
        <div class="rules-card">
            <ul class="rules-list">
                <li>維護公共區域整潔，個人垃圾請定時清理。</li>
                <li>節約用電用水，離開房間時請隨手關閉電燈與冷氣。</li>
                <li>深夜時段請放低音量，避免影響室友及鄰居安寧。</li>
                <li>公共設備若有損壞，請及時回報管理人群組處理。</li>
            </ul>
        </div>
        <div class="copyright">© 2026 GUO DANIEL. ALL RIGHTS RESERVED.</div>
    </div>

    <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalTitle">明細摘要</div>
            <div id="modalBody"></div>
            <button class="close-btn" onclick="closeModal()">關閉明細</button>
        </div>
    </div>

    <script>
        const urlPrimary = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkqhXCPp4XiHKCEpI3pz4pzcu3sQreQ_qNRLger00ULCHFr9cTbXHMQqAfk7dLa_gUBAIBSJ5sZM4F/pub?output=csv&gid=0";
        const urlAnnounce = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkqhXCPp4XiHKCEpI3pz4pzcu3sQreQ_qNRLger00ULCHFr9cTbXHMQqAfk7dLa_gUBAIBSJ5sZM4F/pub?output=csv&gid=1058170538"; 

        let globalParsedData = []; 
        let trendChartInstance = null; 

        // 🕒 計算並自動顯示目前更新時間
        function updateTimestamp() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('updateTimeDisplay').innerText = `資料更新：${yyyy}/${mm}/${dd} ${hh}:${min}`;
        }

        async function startSystem() {
            updateTimestamp();
            await loadAnnouncements();
            await initDashboard();
        }

        async function loadAnnouncements() {
            try {
                const response = await fetch(urlAnnounce);
                const text = await response.text();
                if (text.includes("<!doctype html") || text.includes("<script") || text.includes("login")) return;

                const lines = text.replace(/\r/g, "").split("\n").map(l => l.trim()).filter(l => l);
                if (lines.length < 2) return;

                let html = "";
                let validCount = 0;

                for (let i = 1; i < lines.length; i++) {
                    const cells = lines[i].split(",").map(c => c.replace(/["']/g, '').trim());
                    const content = cells[0];
                    const level = cells[1] || "普通";

                    if (content && !content.includes("<!DOCTYPE")) {
                        validCount++;
                        html += `
                            <div class="announcement-item text-${level}">
                                <span class="badge ${level}">${level}</span> ${content}
                            </div>`;
                    }
                }

                if (validCount > 0) {
                    document.getElementById('marqueeContent').innerHTML = html + html;
                    document.getElementById('marqueeContent').style.animationDuration = `${validCount * 12}s`;
                    document.getElementById('marqueeBar').style.display = "flex";
                }
            } catch (e) {
                console.error("公告欄加載失敗:", e);
            }
        }

        async function initDashboard() {
            try {
                const response = await fetch(urlPrimary);
                const csvText = await response.text();
                
                if (csvText.includes("<!doctype html") || csvText.includes("<script") || csvText.includes("login")) {
                    throw new Error("試算表載入失敗。");
                }

                let cleanText = csvText.replace(/\r/g, "");
                const lines = cleanText.split("\n").map(line => line.trim()).filter(line => line);
                if(lines.length < 2) throw new Error("無數據");

                const monthIdx = 0; const waterIdx = 1; const eleTotalIdx = 11; 
                const deltaIdx = { "內大": 7, "內小": 8, "中": 9, "外": 10, "總和": 6 }; 
                const roomCostIdx = { "內大": 12, "內小": 13, "中": 14, "外": 15 }; 

                let totalWater = 0; let totalElectricity = 0; let historyTotal = 0;
                const labels = []; const waterChartData = []; const eleChartData = [];
                const meterLabels = []; const meterDeltaTotal = [];
                globalParsedData = [];

                for(let i = 1; i < lines.length; i++) {
                    const cells = lines[i].split(",").map(c => c.replace(/["'\uFEFF]/g, '').trim());
                    if(cells.length < 12 || !cells[monthIdx] || cells[monthIdx].includes("基準") || cells[monthIdx].includes("<script")) continue;

                    const monthVal = cells[monthIdx];
                    const waterVal = parseFloat(cells[waterIdx]) || 0;
                    const eleTotalVal = parseFloat(cells[eleTotalIdx]) || 0; 
                    const combinedSum = waterVal + eleTotalVal;

                    const deltaMeters = {
                        "內大": Number(((parseFloat(cells[deltaIdx["內大"]]) || 0) / 10).toFixed(1)),
                        "內小": Number(((parseFloat(cells[deltaIdx["內小"]]) || 0) / 10).toFixed(1)),
                        "中": Number(((parseFloat(cells[deltaIdx["中"]]) || 0) / 10).toFixed(1)),
                        "外": Number(((parseFloat(cells[deltaIdx["外"]]) || 0) / 10).toFixed(1)),
                        "總和": Number(((parseFloat(cells[deltaIdx["總和"]]) || 0) / 10).toFixed(1))
                    };

                    totalWater += waterVal; totalElectricity += eleTotalVal; historyTotal += combinedSum;
                    labels.push(monthVal); waterChartData.push(waterVal); eleChartData.push(eleTotalVal);
                    meterLabels.push(monthVal); meterDeltaTotal.push(deltaMeters["總和"]);

                    const waterPerPerson = Math.floor(waterVal / 4);
                    const waterImpute = waterVal - (waterPerPerson * 4);

                    const roomSum = (parseFloat(cells[roomCostIdx["內大"]]) || 0) + (parseFloat(cells[roomCostIdx["內小"]]) || 0) + (parseFloat(cells[roomCostIdx["中"]]) || 0) + (parseFloat(cells[roomCostIdx["外"]]) || 0);
                    const eleImpute = Math.max(0, Math.floor(eleTotalVal - roomSum));

                    globalParsedData.push({
                        month: monthVal, water: waterVal, waterPerPerson: waterPerPerson, waterImpute: waterImpute,
                        eleTotal: eleTotalVal, eleImpute: eleImpute, total: combinedSum,
                        deltaMeters: deltaMeters,
                        rooms: { 
                            "內大": parseFloat(cells[roomCostIdx["內大"]]) || 0, 
                            "內小": parseFloat(cells[roomCostIdx["內小"]]) || 0, 
                            "中": parseFloat(cells[roomCostIdx["中"]]) || 0, 
                            "外": parseFloat(cells[roomCostIdx["外"]]) || 0 
                        }
                    });
                }

                const latest = globalParsedData[globalParsedData.length - 1];
                const container = document.getElementById('mainContent');
                
                container.innerHTML = `
                    <div class="section-title">當月費用摘要 (${latest.month})</div>
                    <div class="stats-grid">
                        <div class="stat-card current-ele" onclick="openRoomDetails('currentEle')">
                            <div class="stat-label" style="color: #bc6c3a;">當月電費 (點擊看房間明細)</div>
                            <div class="stat-value">NT$ ${latest.eleTotal.toLocaleString()}</div>
                            <div class="impute-note">附註：公基金已自動挹注 NT$ ${latest.eleImpute}</div>
                        </div>
                        <div class="stat-card current-water" onclick="openRoomDetails('currentWater')">
                            <div class="stat-label" style="color: #42637a;">當月水費 (點擊看當月明細)</div>
                            <div class="stat-value">NT$ ${latest.water.toLocaleString()}</div>
                            <div class="impute-note">附註：公基金已自動挹注 NT$ ${latest.waterImpute}</div>
                        </div>
                        <div class="stat-card current-total" onclick="openRoomDetails('currentSummary')">
                            <div class="stat-label" style="color: #5c7d5c;">當月總和 (點擊看小計摘要)</div>
                            <div class="stat-value">NT$ ${latest.total.toLocaleString()}</div>
                            <div class="stat-sub">水費 + 電費當月總支出額</div>
                        </div>
                    </div>

                    <div class="section-title">歷年累積統計</div>
                    <div class="stats-grid">
                        <div class="stat-card history-card" onclick="openRoomDetails('historyEle')">
                            <div class="stat-label">歷年電費總計</div>
                            <div class="stat-value">NT$ ${totalElectricity.toLocaleString()}</div>
                            <div class="stat-sub">查看歷月電費帳單發票紀錄</div>
                        </div>
                        <div class="stat-card history-card" onclick="openRoomDetails('historyWater')">
                            <div class="stat-label">歷年水費總計</div>
                            <div class="stat-value">NT$ ${totalWater.toLocaleString()}</div>
                            <div class="stat-sub">查看歷月自來水費單與挹注紀錄</div>
                        </div>
                        <div class="stat-card history-card" style="background: linear-gradient(135deg, #ffffff 0%, #f6f7f8 100%);" onclick="openRoomDetails('historySummary')">
                            <div class="stat-label">歷年費用總加總</div>
                            <div class="stat-value" style="color: #54606e;">NT$ ${historyTotal.toLocaleString()}</div>
                            <div class="stat-sub">查看歷月水電合併摘要小計</div>
                        </div>
                    </div>

                    <div class="chart-header-row">
                        <div class="section-title">歷年費用趨勢分析</div>
                        <div class="toggle-btn-group">
                            <button class="toggle-btn active" id="btnLine" onclick="switchChartMode('line')">趨勢折線圖</button>
                            <button class="toggle-btn" id="btnBar" onclick="switchChartMode('bar')">堆疊直條圖</button>
                        </div>
                    </div>
                    <div class="chart-card"><div class="chart-container"><canvas id="trendChart"></canvas></div></div>

                    <div class="gray-section">
                        <div class="gray-title">⚙️ 歷月電表抄錄</div>
                        <div class="stats-grid">
                            <div class="stat-card gray-card" onclick="openRoomDetails('meter')">
                                <div class="stat-label" style="color: #7e8794;">當月消耗用電總值 (${latest.month})</div>
                                <div class="stat-value" style="color: #4e5661;">${latest.deltaMeters["總和"]} 度</div>
                                <div class="stat-sub" style="color: #9ba4b0;">點擊展開各房當月實際用電「差值度數」</div>
                            </div>
                        </div>
                        <div class="chart-card" style="background: #f4f6f8; border-color: #d2dae2;"><div class="chart-container" style="height: 220px;"><canvas id="meterChart"></canvas></div></div>
                    </div>
                `;

                renderMainChart('line', labels, eleChartData, waterChartData);

                new Chart(document.getElementById('meterChart').getContext('2d'), {
                    type: 'line',
                    data: { labels: labels, datasets: [{ label: '全戶用電淨增加 (度)', data: meterDeltaTotal, borderColor: '#7e8794', backgroundColor: 'rgba(126, 135, 148, 0.04)', borderWidth: 2, pointBackgroundColor: '#626973', fill: true, tension: 0.2 }]},
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: val => val + ' 度' } } } }
                });

            } catch (error) {
                showError(error.message);
            }
        }

        function renderMainChart(type, labels, eleData, waterData) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            if(trendChartInstance) { trendChartInstance.destroy(); } 

            if(type === 'line') {
                trendChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: '電費帳單', data: eleData, borderColor: '#d97736', backgroundColor: 'transparent', borderWidth: 2.5, pointBackgroundColor: '#d97736', tension: 0.25 },
                            { label: '水費帳單', data: waterData, borderColor: '#527996', backgroundColor: 'transparent', borderWidth: 2.5, pointBackgroundColor: '#527996', tension: 0.25 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks: { callback: val => 'NT$ ' + val.toLocaleString() } } } }
                });
            } else if (type === 'bar') {
                trendChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: '電費帳單', data: eleData, backgroundColor: 'rgba(217, 119, 54, 0.85)', borderRadius: 4 },
                            { label: '水費帳單', data: waterData, backgroundColor: 'rgba(82, 121, 150, 0.85)', borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { stacked: true },
                            y: { stacked: true, ticks: { callback: val => 'NT$ ' + val.toLocaleString() } }
                        }
                    }
                });
            }
        }

        function switchChartMode(mode) {
            const btnLine = document.getElementById('btnLine');
            const btnBar = document.getElementById('btnBar');
            
            if(mode === 'line') {
                btnLine.classList.add('active'); btnBar.classList.remove('active');
            } else {
                btnBar.classList.add('active'); btnLine.classList.remove('active');
            }

            const labels = globalParsedData.map(d => d.month);
            const eleData = globalParsedData.map(d => d.eleTotal);
            const waterData = globalParsedData.map(d => d.water);
            renderMainChart(mode, labels, eleData, waterData);
        }

        function openRoomDetails(type) {
            const overlay = document.getElementById('detailModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            let htmlContent = "";
            const latestItem = globalParsedData[globalParsedData.length - 1];

            // 1. 當月電費明細
            if (type === 'currentEle') {
                title.innerText = "當月電費分房明細";
                htmlContent = `
                    <div class="modal-item-block">
                        <div class="modal-month-title">${latestItem.month} 實付分攤</div>
                        <div class="modal-row"><span class="modal-row-label">內大房間</span><span class="modal-row-value">NT$ ${latestItem.rooms["內大"].toLocaleString()}</span></div>
                        <div class="modal-row"><span class="modal-row-label">內小房間</span><span class="modal-row-value">NT$ ${latestItem.rooms["內小"].toLocaleString()}</span></div>
                        <div class="modal-row"><span class="modal-row-label">中房間</span><span class="modal-row-value">NT$ ${latestItem.rooms["中"].toLocaleString()}</span></div>
                        <div class="modal-row"><span class="modal-row-label">外房間</span><span class="modal-row-value">NT$ ${latestItem.rooms["外"].toLocaleString()}</span></div>
                        <div class="impute-note">* 經電表精算後，公基金已自動挹注分攤 NT$ ${latestItem.eleImpute} 元</div>
                        <div class="modal-row total-line"><span class="modal-row-label">當月電費總額</span><span class="modal-row-value" style="color:#d97736;">NT$ ${latestItem.eleTotal.toLocaleString()}</span></div>
                    </div>`;
            
            // 2. 🌟【核心修正】當月水費：只留最新月
            } else if (type === 'currentWater') {
                title.innerText = "當月水費明細摘要";
                htmlContent = `
                    <div class="modal-item-block">
                        <div class="modal-month-title">${latestItem.month} 自來水費明細</div>
                        <div class="modal-row"><span class="modal-row-label">全戶總水費</span><span class="modal-row-value">NT$ ${latestItem.water.toLocaleString()}</span></div>
                        <div class="modal-row"><span class="modal-row-label">每房實付 (4房均分)</span><span class="modal-row-value">NT$ ${latestItem.waterPerPerson.toLocaleString()}</span></div>
                        <div class="impute-note">* 餘數 NT$ ${latestItem.waterImpute} 已由公共基金自動挹注分攤</div>
                    </div>`;
            
            // 3. 🌟【核心修正】當月總和：只留最新月
            } else if (type === 'currentSummary') {
                title.innerText = "當月水電加總摘要";
                htmlContent = `
                    <div class="modal-item-block">
                        <div class="modal-month-title">${latestItem.month} 支出加總</div>
                        <div class="modal-row"><span class="modal-row-label">總電費金額</span><span class="modal-row-value">NT$ ${latestItem.eleTotal.toLocaleString()}</span></div>
                        <div class="modal-row"><span class="modal-row-label">總水費金額</span><span class="modal-row-value">NT$ ${latestItem.water.toLocaleString()}</span></div>
                        <div class="modal-row total-line"><span class="modal-row-label">當月總計支出</span><span class="modal-row-value" style="color:#6e916e;">NT$ ${latestItem.total.toLocaleString()}</span></div>
                    </div>`;

            // 4. 歷月電費歷史紀錄（交給歷年）
            } else if (type === 'historyEle') {
                title.innerText = "歷月電費總額紀錄";
                globalParsedData.forEach(item => {
                    htmlContent += `
                        <div class="modal-item-block">
                            <div class="modal-month-title">${item.month}</div>
                            <div class="modal-row"><span class="modal-row-label">電費帳單總額</span><span class="modal-row-value">NT$ ${item.eleTotal.toLocaleString()}</span></div>
                            <div class="impute-note" style="background:#f7f8fa; color:#828a95;">當月公基金挹注：NT$ ${item.eleImpute}</div>
                        </div>`;
                });

            // 5. 歷月水費歷史紀錄（交給歷年）
            } else if (type === 'historyWater') {
                title.innerText = "歷月水費明細紀錄";
                globalParsedData.forEach(item => {
                    htmlContent += `
                        <div class="modal-item-block">
                            <div class="modal-month-title">${item.month}</div>
                            <div class="modal-row"><span class="modal-row-label">全戶總水費</span><span class="modal-row-value">NT$ ${item.water.toLocaleString()}</span></div>
                            <div class="modal-row"><span class="modal-row-label">每房實付 (均分)</span><span class="modal-row-value">NT$ ${item.waterPerPerson}</span></div>
                            <div class="impute-note">* 餘數 NT$ ${item.waterImpute} 已由公共基金自動附註挹注</div>
                        </div>`;
                });

            // 6. 歷月加總歷史紀錄（交給歷年）
            } else if (type === 'historySummary') {
                title.innerText = "歷史總和摘要紀錄";
                globalParsedData.forEach(item => {
                    htmlContent += `
                        <div class="modal-item-block">
                            <div class="modal-month-title">${item.month}</div>
                            <div class="modal-row"><span class="modal-row-label">總電費金額</span><span class="modal-row-value">NT$ ${item.eleTotal.toLocaleString()}</span></div>
                            <div class="modal-row"><span class="modal-row-label">總水費金額</span><span class="modal-row-value">NT$ ${item.water.toLocaleString()}</span></div>
                            <div class="modal-row total-line"><span class="modal-row-label">總計支出</span><span class="modal-row-value">NT$ ${item.total.toLocaleString()}</span></div>
                        </div>`;
                });

            // 7. 電表度數
            } else if (type === 'meter') {
                title.innerText = "歷月實際用電差值 (度)";
                htmlContent = `
                    <div style="background:#eef2f5; padding:12px; border-radius:12px; font-size:12px; color:#54606e; margin-bottom:15px; line-height:1.5; border: 1px solid #dbe2e8;">
                        📌 <b>初始入住電表基準值：</b><br>
                        內大: 63370 | 內小: 40104 | 中: 36646 | 外: 74799
                    </div>`;
                globalParsedData.forEach(item => {
                    htmlContent += `
                        <div class="modal-item-block" style="background:#f8fafc; padding:12px; border-radius:12px; margin-bottom:10px; border: 1px solid #eef2f5;">
                            <div class="modal-month-title" style="color:#54606e;">${item.month} 實際用電</div>
                            <div class="modal-row"><span class="modal-row-label">內大房間</span><span class="modal-row-value">${item.deltaMeters["內大"]} 度</span></div>
                            <div class="modal-row"><span class="modal-row-label">內小房間</span><span class="modal-row-value">${item.deltaMeters["內小"]} 度</span></div>
                            <div class="modal-row"><span class="modal-row-label">中房間</span><span class="modal-row-value">${item.deltaMeters["中"]} 度</span></div>
                            <div class="modal-row"><span class="modal-row-label">外房間</span><span class="modal-row-value">${item.deltaMeters["外"]} 度</span></div>
                            <div class="modal-row total-line" style="border-color:#d2dae2;"><span class="modal-row-label" style="color:#4a515a;">全戶用電淨增加</span><span class="modal-row-value" style="color:#527996;">${item.deltaMeters["總和"]} 度</span></div>
                        </div>`;
                });
            }

            body.innerHTML = htmlContent;
            overlay.classList.add('active');
        }

        function closeModal() { document.getElementById('detailModal').classList.remove('active'); }

        function showError(msg) {
            document.getElementById('mainContent').innerHTML = `
                <div class="loading" style="color: #b54a4a; text-align: left; max-width: 600px; margin: 0 auto;">
                    ❌ 系統載入失敗。<br><br>
                    <span style="font-size:13px; color:#828a95;">${msg}</span>
                </div>`;
        }

        startSystem();
    </script>
</body>
</html>
