<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍智慧管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'PingFang TC', 'SF Pro Display', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f3f4f9 0%, #e8ebf5 100%);
            margin: 0; padding: 0; min-height: 100vh; color: #2d3748;
        }
        .header-banner {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white; padding: 40px 24px 60px 24px; text-align: left;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.15);
        }
        .header-container { max-width: 1200px; margin: 0 auto; }
        .header-banner h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
        .header-banner p { margin: 8px 0 0 0; opacity: 0.8; font-size: 14px; }

        /* 公告欄跑馬燈 */
        .marquee-wrapper {
            background: #ffffff; border-bottom: 1px solid #e2e8f0; height: 44px;
            overflow: hidden; position: relative; display: flex; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .marquee-title {
            position: absolute; left: 0; top: 0; bottom: 0; background: #4a5568;
            color: #ffffff; padding: 0 16px; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; z-index: 10;
        }
        .marquee-content {
            display: flex; white-space: nowrap; position: absolute; left: 100%;
            animation: marquee linear infinite; padding-left: 20px;
        }
        @keyframes marquee {
            0% { left: 100%; transform: translate3d(0,0,0); }
            100% { left: 0; transform: translate3d(-100%,0,0); }
        }
        .announcement-item { display: inline-flex; align-items: center; margin-right: 50px; font-size: 14px; font-weight: 500; }
        .badge { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-right: 8px; }
        .badge.緊急 { background: #ef4444; color: white; animation: pulse 1s infinite alternate; }
        .badge.重要 { background: #f97316; color: white; }
        .badge.普通 { background: #e2e8f0; color: #4a5568; }
        .text-緊急 { color: #dc2626; font-weight: 700; }
        .text-重要 { color: #ea580c; }
        .text-普通 { color: #4a5568; }
        @keyframes pulse { 0% { opacity: 1; } 100% { opacity: 0.6; } }

        .main-container { max-width: 1200px; margin: 0 auto 40px auto; padding: 0 20px; box-sizing: border-box; }
        .spacer-top { margin-top: 40px; }
        .section-title { font-size: 18px; font-weight: 600; margin: 35px 0 15px 0; color: #4a5568; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-radius: 24px; padding: 24px;
            box-shadow: 0 10px 25px rgba(160, 174, 192, 0.1); border: 1px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease; position: relative; cursor: pointer;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(160, 174, 192, 0.2); }
        .stat-label { font-size: 14px; color: #718096; margin-bottom: 8px; font-weight: 500; }
        .stat-value { font-size: 26px; font-weight: 700; color: #1a202c; }
        .stat-sub { font-size: 12px; color: #a0aec0; margin-top: 6px; }
        .stat-card.highlight { background: linear-gradient(135deg, #ffffff 0%, #f5f3ff 100%); border: 1px solid rgba(124, 58, 237, 0.2); }
        .stat-card.highlight .stat-value { color: #4f46e5; }
        
        .chart-card { background: #ffffff; border-radius: 24px; padding: 24px; box-shadow: 0 10px 25px rgba(160, 174, 192, 0.1); margin-bottom: 30px; }
        .chart-container { position: relative; height: 350px; width: 100%; }
        
        .gray-section { background: #e4e7eb; border-radius: 28px; padding: 24px; margin-top: 40px; border: 1px solid #cbd5e1; }
        .gray-title { color: #334155; font-size: 17px; font-weight: 600; margin-bottom: 16px; }
        .gray-card { background: #f8fafc; border-radius: 20px; padding: 20px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }

        .rules-card { background: #ffffff; border-radius: 24px; padding: 28px; box-shadow: 0 10px 25px rgba(160, 174, 192, 0.1); margin-bottom: 40px; }
        .rules-list { margin: 0; padding-left: 20px; color: #4a5568; line-height: 1.8; }
        .rules-list li { margin-bottom: 10px; }

        /* 彈窗 UI */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box {
            background: #ffffff; width: 90%; max-width: 420px; border-radius: 32px; padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); transform: translateY(30px);
            transition: transform 0.3s ease; max-height: 80vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        .modal-title { font-size: 24px; font-weight: 700; color: #4f46e5; margin-bottom: 24px; }
        .modal-item-block { border-bottom: 1px solid #edf2f7; padding: 16px 0; }
        .modal-item-block:last-child { border-bottom: none; }
        .modal-month-title { font-size: 18px; font-weight: 700; color: #4f46e5; margin-bottom: 12px; }
        .modal-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 15px; }
        .modal-row-label { color: #718096; font-weight: 500; }
        .modal-row-value { color: #2d3748; font-weight: 600; }
        .modal-row.total-line { border-top: 1px dashed #e2e8f0; margin-top: 12px; padding-top: 12px; }
        .modal-row.total-line .modal-row-label { color: #2d3748; font-weight: 600; }
        .modal-row.total-line .modal-row-value { color: #4f46e5; font-size: 18px; font-weight: 700; }
        
        /* 挹注金額專用弱化附註樣式 */
        .water-impute-note { font-size: 12px; color: #16a34a; opacity: 0.75; font-weight: 400; text-align: right; margin-top: 4px; }

        .close-btn { background: #f3f4f9; color: #4a5568; border: none; width: 100%; padding: 14px; border-radius: 16px; font-weight: 600; margin-top: 20px; cursor: pointer; }
        .copyright { text-align: center; color: #a0aec0; font-size: 12px; padding-bottom: 30px; letter-spacing: 1px; }
        .loading { text-align: center; padding: 40px; font-size: 16px; color: #7c3aed; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header-banner">
        <div class="header-container">
            <h1>宿舍智慧管理系統</h1>
            <p>新竹市東區建功一路47巷五樓（孟竹國宅）</p>
        </div>
    </div>

    <div class="marquee-wrapper" id="marqueeBar" style="display:none;">
        <div class="marquee-title">公告欄</div>
        <div class="marquee-content" id="marqueeContent"></div>
    </div>

    <div class="main-container">
        <div id="mainContent">
            <div class="loading">智慧讀取雲端試算表資料中...</div>
        </div>
    </div>
    
    <div class="main-container">
        <div class="section-title">宿舍規範</div>
        <div class="rules-card">
            <ul class="rules-list">
                <li>維護公共區域整潔，個人垃圾請定時清理。</li>
                <li>節約用電用水，離開房間時請隨手關閉電燈與冷氣。</li>
                <li>深夜時段請放低音量，避免影響室友及鄰居安寧。</li>
                <li>公共設備若有損壞，請及時回報管理人群組處理。</li>
            </ul>
        </div>
        <div class="copyright">© 2026 GUO DANIEL. ALL RIGHTS RESERVED.</div>
    </div>

    <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalTitle">明細摘要</div>
            <div id="modalBody"></div>
            <button class="close-btn" onclick="closeModal()">關閉明細</button>
        </div>
    </div>

    <script>
        // 固定使用你取得的正確 CSV 發布網址
        const urlPrimary = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkqhXCPp4XiHKCEpI3pz4pzcu3sQreQ_qNRLger00ULCHFr9cTbXHMQqAfk7dLa_gUBAIBSJ5sZM4F/pub?output=csv&gid=0";
        const urlAnnounce = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkqhXCPp4XiHKCEpI3pz4pzcu3sQreQ_qNRLger00ULCHFr9cTbXHMQqAfk7dLa_gUBAIBSJ5sZM4F/pub?output=csv&gid=1058170538"; 

        let globalParsedData = []; 

        async function startSystem() {
            await loadAnnouncements();
            await initDashboard();
        }

        async function loadAnnouncements() {
            try {
                const response = await fetch(urlAnnounce);
                const text = await response.text();
                if (text.includes("<!doctype html") || text.includes("<script") || text.includes("login")) return;

                const lines = text.replace(/\r/g, "").split("\n").map(l => l.trim()).filter(l => l);
                if (lines.length < 2) return;

                let html = "";
                let validCount = 0;

                for (let i = 1; i < lines.length; i++) {
                    const cells = lines[i].split(",").map(c => c.replace(/["']/g, '').trim());
                    const content = cells[0];
                    const level = cells[1] || "普通";

                    if (content && !content.includes("<!DOCTYPE")) {
                        validCount++;
                        html += `
                            <div class="announcement-item text-${level}">
                                <span class="badge ${level}">${level}</span> ${content}
                            </div>`;
                    }
                }

                if (validCount > 0) {
                    document.getElementById('marqueeContent').innerHTML = html + html;
                    document.getElementById('marqueeContent').style.animationDuration = `${validCount * 12}s`;
                    document.getElementById('marqueeBar').style.display = "flex";
                }
            } catch (e) {
                console.error("公告欄加載失敗:", e);
            }
        }

        async function initDashboard() {
            try {
                const response = await fetch(urlPrimary);
                const csvText = await response.text();
                
                if (csvText.includes("<!doctype html") || csvText.includes("<script") || csvText.includes("login") || csvText.includes("Google Accounts")) {
                    throw new Error("試算表讀取權限異常，請確認試算表是否有維持發布狀態。");
                }

                let cleanText = csvText.replace(/\r/g, "");
                const lines = cleanText.split("\n").map(line => line.trim()).filter(line => line);
                if(lines.length < 2) throw new Error("無足夠的資料列數");

                const monthIdx = 0; const waterIdx = 1; const eleTotalIdx = 11;
                const meterIdx = { "內大": 2, "內小": 3, "中": 4, "外": 5, "總和": 6 };
                const roomIdx = { "內大": 12, "內小": 13, "中": 14, "外": 15 };

                let totalWater = 0; let totalElectricity = 0; let historyTotal = 0;
                const labels = []; const waterChartData = []; const eleChartData = [];
                const meterLabels = []; const meterDeltaTotal = [];
                globalParsedData = [];

                // 為了算底數差值，我們需要留存「上一列」的底數資料做相減
                let prevMeters = null;

                for(let i = 1; i < lines.length; i++) {
                    const cells = lines[i].split(",").map(c => c.replace(/["'\uFEFF]/g, '').trim());
                    if(cells.length < 7 || !cells[monthIdx] || cells[monthIdx].includes("基準") || cells[monthIdx].includes("<script")) continue;

                    const monthVal = cells[monthIdx];
                    const waterVal = parseFloat(cells[waterIdx]) || 0;
                    const eleTotalVal = parseFloat(cells[eleTotalIdx]) || 0; 
                    const combinedSum = waterVal + eleTotalVal;

                    // 當期累積底數現值
                    const currMeters = {
                        "內大": parseFloat(cells[meterIdx["內大"]]) || 0,
                        "內小": parseFloat(cells[meterIdx["內小"]]) || 0,
                        "中": parseFloat(cells[meterIdx["中"]]) || 0,
                        "外": parseFloat(cells[meterIdx["外"]]) || 0,
                        "總和": parseFloat(cells[meterIdx["總和"]]) || 0
                    };

                    // 🛠️【核心修正五】非歸零，計算電表「差值度數」（當月消耗度數）
                    let deltaMeters = { "內大": 0, "內小": 0, "中": 0, "外": 0, "總和": 0 };
                    if (prevMeters !== null) {
                        deltaMeters["內大"] = Math.max(0, Number((currMeters["內大"] - prevMeters["內大"]).toFixed(2)));
                        deltaMeters["內小"] = Math.max(0, Number((currMeters["內小"] - prevMeters["內小"]).toFixed(2)));
                        deltaMeters["中"] = Math.max(0, Number((currMeters["中"] - prevMeters["中"]).toFixed(2)));
                        deltaMeters["外"] = Math.max(0, Number((currMeters["外"] - prevMeters["外"]).toFixed(2)));
                        deltaMeters["總和"] = Math.max(0, Number((currMeters["總和"] - prevMeters["總和"]).toFixed(2)));
                    } else {
                        // 如果是第一筆資料（無上月紀錄可減），改從試算表本身 L 欄後的用電度數估算，或預設帶 0
                        deltaMeters["總和"] = 0; 
                    }

                    totalWater += waterVal; totalElectricity += eleTotalVal; historyTotal += combinedSum;
                    labels.push(monthVal); waterChartData.push(waterVal); eleChartData.push(eleTotalVal);
                    
                    // 只有在有前月差值時，才把月份和用電差值推進去圖表
                    if (prevMeters !== null) {
                        meterLabels.push(monthVal);
                        meterDeltaTotal.push(deltaMeters["總和"]);
                    }

                    const waterPerPerson = Math.floor(waterVal / 4);
                    const waterImpute = waterVal - (waterPerPerson * 4);

                    globalParsedData.push({
                        month: monthVal, water: waterVal, waterPerPerson: waterPerPerson, waterImpute: waterImpute,
                        eleTotal: eleTotalVal, total: combinedSum,
                        hasPrev: (prevMeters !== null),
                        deltaMeters: deltaMeters,
                        rooms: { "內大": parseFloat(cells[roomIdx["內大"]]) || 0, "內小": parseFloat(cells[roomIdx["內小"]]) || 0, "中": parseFloat(cells[roomIdx["中"]]) || 0, "外": parseFloat(cells[roomIdx["外"]]) || 0 }
                    });

                    // 記錄下這一輪的底數，供下一輪相減
                    prevMeters = currMeters;
                }

                if (globalParsedData.length === 0) throw new Error("無效的月份數據，請確認試算表格式");
                const latest = globalParsedData[globalParsedData.length - 1];
                const container = document.getElementById('mainContent');
                
                container.innerHTML = `
                    <div class="section-title spacer-top">當月費用摘要 (${latest.month})</div>
                    <div class="stats-grid">
                        <div class="stat-card" onclick="openRoomDetails('ele')">
                            <div class="stat-label">當月電費 (點擊看歷月總額)</div>
                            <div class="stat-value">NT$ ${latest.eleTotal.toLocaleString()}</div>
                            <div class="stat-sub">已同步完成公共基金分攤計算</div>
                        </div>
                        <div class="stat-card" onclick="openRoomDetails('water')">
                            <div class="stat-label">當月水費 (點擊看歷月總額)</div>
                            <div class="stat-value">NT$ ${latest.water.toLocaleString()}</div>
                            <div class="stat-sub">每房均分：NT$ ${latest.waterPerPerson} <span style="color:#16a34a; opacity:0.8; font-size:11px;">(附註：公基金已自動挹注 NT$ ${latest.waterImpute})</span></div>
                        </div>
                        <div class="stat-card highlight" onclick="openRoomDetails('summary')">
                            <div class="stat-label">當月總和 (點擊看小計摘要)</div>
                            <div class="stat-value">NT$ ${latest.total.toLocaleString()}</div>
                            <div class="stat-sub">水費 + 電費合計總額</div>
                        </div>
                    </div>

                    <div class="section-title">歷年累積統計</div>
                    <div class="stats-grid">
                        <div class="stat-card" onclick="openRoomDetails('ele')">
                            <div class="stat-label">歷年電費總計</div>
                            <div class="stat-value" style="color: #e11d48;">NT$ ${totalElectricity.toLocaleString()}</div>
                            <div class="stat-sub">查看歷月電費帳單總額紀錄</div>
                        </div>
                        <div class="stat-card" onclick="openRoomDetails('water')">
                            <div class="stat-label">歷年水費總計</div>
                            <div class="stat-value" style="color: #0284c7;">NT$ ${totalWater.toLocaleString()}</div>
                            <div class="stat-sub">查看歷月水費與公基金分攤</div>
                        </div>
                        <div class="stat-card highlight" style="background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%); border-color: rgba(34, 197, 94, 0.2);" onclick="openRoomDetails('summary')">
                            <div class="stat-label">歷年費用總加總</div>
                            <div class="stat-value" style="color: #16a34a;">NT$ ${historyTotal.toLocaleString()}</div>
                            <div class="stat-sub">查看歷月總和摘要小計</div>
                        </div>
                    </div>

                    <div class="section-title">歷年費用趨勢折線圖</div>
                    <div class="chart-card"><div class="chart-container"><canvas id="trendChart"></canvas></div></div>

                    <div class="gray-section">
                        <div class="gray-title">⚙️ 歷月電表抄錄</div>
                        <div class="stats-grid">
                            <div class="stat-card gray-card" onclick="openRoomDetails('meter')">
                                <div class="stat-label" style="color: #64748b;">當月消耗用電總值 (${latest.month})</div>
                                <div class="stat-value" style="color: #475569;">${latest.deltaMeters["總和"]} 度</div>
                                <div class="stat-sub" style="color: #94a3b8;">點擊展開各房當月實際用電「差值度數」</div>
                            </div>
                        </div>
                        <div class="chart-card" style="background: #f1f5f9; border-color: #cbd5e1;"><div class="chart-container" style="height: 220px;"><canvas id="meterChart"></canvas></div></div>
                    </div>
                `;

                new Chart(document.getElementById('trendChart').getContext('2d'), {
                    type: 'line',
                    data: { labels: labels, datasets: [
                        { label: '電費總計', data: eleChartData, borderColor: '#e11d48', backgroundColor: 'transparent', borderWidth: 3, pointBackgroundColor: '#e11d48', tension: 0.3 },
                        { label: '水費總計', data: waterChartData, borderColor: '#0284c7', backgroundColor: 'transparent', borderWidth: 3, pointBackgroundColor: '#0284c7', tension: 0.3 }
                    ]},
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks: { callback: val => 'NT$ ' + val.toLocaleString() } } } }
                });

                new Chart(document.getElementById('meterChart').getContext('2d'), {
                    type: 'line',
                    data: { labels: meterLabels, datasets: [{ label: '全戶實際用電差值 (度)', data: meterDeltaTotal, borderColor: '#64748b', backgroundColor: 'rgba(100, 116, 139, 0.05)', borderWidth: 2, pointBackgroundColor: '#475569', fill: true, tension: 0.2 }]},
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: val => val + ' 度' } } } }
                });

            } catch (error) {
                showError(error.message);
            }
        }

        function openRoomDetails(type) {
            const overlay = document.getElementById('detailModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            let htmlContent = "";

            if (type === 'ele') {
                // 🛠️【核心修正二】只顯示歷月電費總額即可，不拆分房間
                title.innerText = "歷月電費總額紀錄";
                globalParsedData.forEach(item => {
                    htmlContent += `
                        <div class="modal-item-block">
                            <div class="modal-month-title">${item.month}</div>
                            <div class="modal-row total-line" style="border-top:none; margin-top:0; padding-top:0;"><span class="modal-row-label">當月電費總金額</span><span class="modal-row-value" style="color:#e11d48;">NT$ ${item.eleTotal.toLocaleString()}</span></div>
                        </div>`;
                });
            } else if (type === 'water') {
                // 🛠️【核心修正一、三】只顯示歷月水費總額與均分，且弱化挹注金額為附註
                title.innerText = "歷月水費明細紀錄";
                globalParsedData.forEach(item => {
                    htmlContent += `
                        <div class="modal-item-block">
                            <div class="modal-month-title">${item.month}</div>
                            <div class="modal-row"><span class="modal-row-label">全戶總水費</span><span class="modal-row-value">NT$ ${item.water.toLocaleString()}</span></div>
                            <div class="modal-row"><span class="modal-row-label">每房實付 (均分)</span><span class="modal-row-value">NT$ ${item.waterPerPerson}</span></div>
                            <div class="water-impute-note">* 餘數 NT$ ${item.waterImpute} 已由公共基金自動挹注分攤</div>
                        </div>`;
                });
            } else if (type === 'summary') {
                title.innerText = "歷史總和摘要";
                globalParsedData.forEach(item => {
                    htmlContent += `
                        <div class="modal-item-block">
                            <div class="modal-month-title">${item.month}</div>
                            <div class="modal-row"><span class="modal-row-label">總電費金額</span><span class="modal-row-value">NT$ ${item.eleTotal.toLocaleString()}</span></div>
                            <div class="modal-row"><span class="modal-row-label">總水費金額</span><span class="modal-row-value">NT$ ${item.water.toLocaleString()}</span></div>
                            <div class="modal-row total-line"><span class="modal-row-label">總計應付金額</span><span class="modal-row-value">NT$ ${item.total.toLocaleString()}</span></div>
                        </div>`;
                });
            } else if (type === 'meter') {
                // 🛠️【核心修正五】彈窗顯示各房「本月實際用電差值度數」，排除非歸零的現值誤導
                title.innerText = "歷月用電差值紀錄 (度)";
                globalParsedData.forEach(item => {
                    if(!item.hasPrev) {
                        htmlContent += `
                            <div class="modal-item-block" style="background:#f8fafc; padding:12px; border-radius:12px; margin-bottom:10px;">
                                <div class="modal-month-title" style="color:#94a3b8;">${item.month}</div>
                                <div style="font-size:13px; color:#94a3b8; text-align:center;">此月份為初始入住基準，無上月底數可對比。</div>
                            </div>`;
                    } else {
                        htmlContent += `
                            <div class="modal-item-block" style="background:#f8fafc; padding:12px; border-radius:12px; margin-bottom:10px;">
                                <div class="modal-month-title" style="color:#475569;">${item.month} 實際消耗</div>
                                <div class="modal-row"><span class="modal-row-label">內大房間</span><span class="modal-row-value">${item.deltaMeters["內大"]} 度</span></div>
                                <div class="modal-row"><span class="modal-row-label">內小房間</span><span class="modal-row-value">${item.deltaMeters["內小"]} 度</span></div>
                                <div class="modal-row"><span class="modal-row-label">中房間</span><span class="modal-row-value">${item.deltaMeters["中"]} 度</span></div>
                                <div class="modal-row"><span class="modal-row-label">外房間</span><span class="modal-row-value">${item.deltaMeters["外"]} 度</span></div>
                                <div class="modal-row total-line" style="border-color:#cbd5e1;"><span class="modal-row-label" style="color:#334155;">全戶用電淨增加</span><span class="modal-row-value" style="color:#4f46e5;">${item.deltaMeters["總和"]} 度</span></div>
                            </div>`;
                    }
                });
            }

            body.innerHTML = htmlContent;
            overlay.classList.add('active');
        }

        function closeModal() { document.getElementById('detailModal').classList.remove('active'); }

        function showError(msg) {
            document.getElementById('mainContent').innerHTML = `
                <div class="loading" style="color: #e53e3e; text-align: left; max-width: 600px; margin: 0 auto;">
                    ❌ 系統載入失敗。<br><br>
                    <span style="font-size:14px; color:#718096;">錯誤訊息：${msg}</span>
                </div>`;
        }

        startSystem();
    </script>
</body>
</html>
