<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍智慧管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 🎨 莫蘭迪（Morandi）高級色系全站定義 */
        :root {
            --m-bg: #f4f5f7;
            --m-banner: #69779b;
            --m-text: #4a515a;
            --m-subtext: #8a929a;
            --m-orange: #d97736;
            --m-blue: #527996;
            --m-green: #6e916e;
            --m-gray: #7e8794;
            --m-border: #e1e4e8;
            --m-white: #ffffff;
        }

        body {
            font-family: 'PingFang TC', 'SF Pro Display', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, var(--m-bg) 0%, #eaecef 100%);
            margin: 0; padding: 0; min-height: 100vh; color: var(--m-text);
        }

        /* 頂部 Banner */
        .header-banner {
            background: linear-gradient(135deg, var(--m-banner) 0%, #8696b8 100%);
            color: white; padding: 45px 24px 65px 24px; text-align: left;
            box-shadow: 0 4px 20px rgba(105, 119, 155, 0.15);
            position: relative;
        }
        .header-container { max-width: 1200px; margin: 0 auto; position: relative; }
        .header-banner h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1.5px; color: #f4f5f7; }
        .header-banner p { margin: 10px 0 0 0; opacity: 0.85; font-size: 13px; letter-spacing: 0.5px; }
        
        .update-time-tag {
            position: absolute; right: 0; bottom: -45px; font-size: 11px;
            color: rgba(255, 255, 255, 0.75); background: rgba(0, 0, 0, 0.12);
            padding: 4px 10px; border-radius: 20px; font-weight: 500;
            letter-spacing: 0.5px; backdrop-filter: blur(4px);
        }

        /* 🧭 莫蘭迪分頁導覽列 */
        .nav-tabs {
            display: flex; justify-content: center; background: var(--m-white);
            border-bottom: 1px solid var(--m-border); gap: 20px; padding: 0 20px;
        }
        .nav-link {
            padding: 15px 20px; font-size: 14px; font-weight: 600; color: var(--m-subtext);
            cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s;
        }
        .nav-link.active { color: var(--m-banner); border-bottom-color: var(--m-banner); }

        /* 公告欄跑馬燈 */
        .marquee-wrapper {
            background: var(--m-white); border-bottom: 1px solid var(--m-border); height: 44px;
            overflow: hidden; position: relative; display: flex; align-items: center;
        }
        .marquee-title {
            position: absolute; left: 0; top: 0; bottom: 0; background: #7a828a;
            color: white; padding: 0 16px; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; z-index: 10; letter-spacing: 1px;
        }
        .marquee-content {
            display: flex; white-space: nowrap; position: absolute; left: 100%;
            animation: marquee linear infinite; padding-left: 20px;
        }
        @keyframes marquee {
            0% { left: 100%; transform: translate3d(0,0,0); }
            100% { left: 0; transform: translate3d(-100%,0,0); }
        }
        .badge { padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-right: 8px; }
        .badge.緊急 { background: #d96b6b; color: white; animation: pulse 1s infinite alternate; }
        .badge.重要 { background: #d9886b; color: white; }
        .badge.普通 { background: #cbd1d6; color: #5a6168; }
        @keyframes pulse { 0% { opacity: 1; } 100% { opacity: 0.6; } }

        /* 頁面容器 */
        .main-container { max-width: 1200px; margin: 0 auto 40px auto; padding: 0 20px; box-sizing: border-box; }
        .page { display: none; }
        .page.active { display: block; }

        /* 標題與空間 */
        .section-title { 
            font-size: 16px; font-weight: 600; color: #626973; 
            letter-spacing: 1px; margin: 42px 0 18px 0; display: block;
        }
        
        /* 基礎卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 0; }
        .stat-card {
            background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 24px;
            box-shadow: 0 8px 20px rgba(140, 149, 159, 0.08); border: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.3s; cursor: pointer;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(140, 149, 159, 0.15); }
        .stat-label { font-size: 13px; color: var(--m-subtext); margin-bottom: 10px; font-weight: 500; }
        .stat-value { font-size: 24px; font-weight: 700; color: #3a414a; }
        .stat-sub { font-size: 12px; color: #9ba3ab; margin-top: 8px; line-height: 1.5; }

        /* 特殊色系卡片 */
        .current-ele { background: linear-gradient(135deg, #fff 0%, #fdf6f0 100%); border-color: rgba(217, 119, 54, 0.15); }
        .current-ele .stat-value { color: var(--m-orange); }
        .current-water { background: linear-gradient(135deg, #fff 0%, #edf3f7 100%); border-color: rgba(82, 121, 150, 0.18); }
        .current-water .stat-value { color: var(--m-blue); }
        .current-total { background: linear-gradient(135deg, #fff 0%, #f3f6f3 100%); border-color: rgba(110, 145, 110, 0.15); }
        .current-total .stat-value { color: var(--m-green); }

        .chart-card { background: var(--m-white); border-radius: 20px; padding: 24px; border: 1px solid var(--m-border); margin-top: 20px; }
        .chart-container { position: relative; height: 350px; width: 100%; }

        /* 🔘 個人資訊區專用：選擇器與個人標頭 */
        .person-selector-wrap { margin-top: 30px; display: flex; align-items: center; gap: 15px; }
        .person-select {
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--m-border);
            font-size: 15px; color: var(--m-text); background: white; cursor: pointer;
        }
        .person-profile-header {
            background: var(--m-white); border-radius: 24px; padding: 30px;
            margin-top: 20px; border: 1px solid var(--m-border);
            display: flex; flex-direction: column; gap: 10px;
        }
        .profile-name { font-size: 28px; font-weight: 700; color: var(--m-banner); }
        .profile-info { font-size: 14px; color: var(--m-subtext); }
        .violation-badge {
            display: inline-block; background: #fdf2f2; color: #d96b6b;
            padding: 4px 12px; border-radius: 8px; font-weight: 700; font-size: 12px;
        }

        /* 📋 費用彙整表格樣式 */
        .summary-table-wrap { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 16px; overflow: hidden; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid var(--m-border); font-size: 14px; }
        th { background: #f8fafc; color: var(--m-subtext); font-weight: 600; }
        .total-cell { font-weight: 700; color: var(--m-banner); }

        /* 彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(58, 65, 74, 0.35);
            backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box {
            background: #ffffff; width: 90%; max-width: 450px; border-radius: 28px; padding: 30px;
            max-height: 80vh; overflow-y: auto; border: 1px solid var(--m-border);
        }
        .modal-title { font-size: 20px; font-weight: 700; color: #5a6578; margin-bottom: 20px; }
        .impute-note { font-size: 11px; color: #769476; background: #f3f7f3; padding: 6px 10px; border-radius: 8px; margin-top: 5px; }
        .close-btn { background: #f0f2f5; color: #626973; border: none; width: 100%; padding: 14px; border-radius: 14px; font-weight: 600; margin-top: 20px; cursor: pointer; }

        @media (max-width: 768px) {
            .stats-grid { gap: 28px; }
            .header-banner { padding: 35px 20px 45px 20px; }
            .update-time-tag { bottom: -28px; right: 20px; }
            .chart-container { height: 280px; }
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <div class="header-container">
            <h1>宿舍智慧管理系統</h1>
            <p>新竹市東區建功一路47巷五樓（孟竹國宅）</p>
            <div class="update-time-tag" id="updateTimeDisplay">資料同步中...</div>
        </div>
    </div>

    <div class="nav-tabs">
        <div class="nav-link active" onclick="switchPage('home')">首頁儀表板</div>
        <div class="nav-link" onclick="switchPage('personal')">房客個人資訊區</div>
    </div>

    <div class="marquee-wrapper" id="marqueeBar" style="display:none;">
        <div class="marquee-title">公告欄</div>
        <div class="marquee-content" id="marqueeContent"></div>
    </div>

    <div id="page-home" class="page active">
        <div class="main-container">
            <div id="homeContent">
                <div class="loading" style="padding:40px; text-align:center;">讀取數據並建立中...</div>
            </div>
        </div>
    </div>

    <div id="page-personal" class="page">
        <div class="main-container">
            <div class="person-selector-wrap">
                <span>選擇房客：</span>
                <select class="person-select" id="tenantSelector" onchange="renderPersonalData()"></select>
            </div>

            <div id="personalProfileArea">
                </div>
        </div>
    </div>

    <div class="main-container">
        <div class="section-title">宿舍規範</div>
        <div class="rules-card">
            <ul class="rules-list">
                <li>維護公共區域整潔，個人垃圾請定時清理。</li>
                <li>節約用電用水，離開房間時請隨手關閉電燈與冷氣。</li>
                <li>深夜時段請放低音量，避免影響室友及鄰居安寧。</li>
            </ul>
        </div>
        <div class="copyright">© 2026 GUO DANIEL. ALL RIGHTS RESERVED.</div>
    </div>

    <div class="modal-overlay" id="detailModal" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalTitle">明細摘要</div>
            <div id="modalBody"></div>
            <button class="close-btn" onclick="closeModal()">關閉明細</button>
        </div>
    </div>

    <script>
        // 🚀 定義三個分頁的正式發布網址
        const SPREADSHEET_ID = "1hSZn-whbD_1ymRajG9nlc17-l1xCaQwsmg38h2ukNHI";
        const urlMaster = `https://docs.google.com/spreadsheets/d/e/2PACX-1vR6zS-Y6VdMAt732e7g11p60x_nS34r6-uorv9f-hK_MbyTclSqnG4I7bM3M98wL_8_23-5eA-v9I-I/pub?output=csv&gid=0`; // 費用總表
        const urlAnnounce = `https://docs.google.com/spreadsheets/d/e/2PACX-1vR6zS-Y6VdMAt732e7g11p60x_nS34r6-uorv9f-hK_MbyTclSqnG4I7bM3M98wL_8_23-5eA-v9I-I/pub?output=csv&gid=1058170538`; // 公告欄
        const urlTenants = `https://docs.google.com/spreadsheets/d/e/2PACX-1vR6zS-Y6VdMAt732e7g11p60x_nS34r6-uorv9f-hK_MbyTclSqnG4I7bM3M98wL_8_23-5eA-v9I-I/pub?output=csv&gid=143232120`; // 房客資訊

        let masterData = []; 
        let tenantMap = {}; // 房號對應姓名
        let tenantList = []; // 房客名單資訊
        let personalChartInstance = null;

        async function startSystem() {
            updateTimestamp();
            await fetchTenantInfo();
            await loadAnnouncements();
            await fetchMasterData();
            switchPage('home');
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('updateTimeDisplay').innerText = `資料更新：${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        }

        // 🟢 抓取房客資訊分頁
        async function fetchTenantInfo() {
            try {
                const res = await fetch(urlTenants);
                const csv = await res.text();
                const lines = csv.split("\n").map(l => l.trim()).filter(l => l);
                lines.shift(); // 移除標題

                const selector = document.getElementById('tenantSelector');
                selector.innerHTML = "";

                lines.forEach(line => {
                    const cells = line.split(",").map(c => c.replace(/["']/g, '').trim());
                    const roomKey = cells[0]; // 內大, 內小...
                    const name = cells[1];
                    const rent = cells[3];
                    const violations = cells[5];

                    tenantMap[roomKey] = name;
                    tenantList.push({ roomKey, name, rent, violations });

                    const opt = document.createElement('option');
                    opt.value = roomKey;
                    opt.innerText = `${name} (${roomKey})`;
                    selector.appendChild(opt);
                });
            } catch(e) { console.error("房客資訊載入失敗", e); }
        }

        // 🟢 載入公告欄
        async function loadAnnouncements() {
            try {
                const res = await fetch(urlAnnounce);
                const csv = await res.text();
                const lines = csv.split("\n").map(l => l.trim()).filter(l => l);
                if (lines.length < 2) return;
                let html = "";
                for (let i = 1; i < lines.length; i++) {
                    const cells = lines[i].split(",").map(c => c.replace(/["']/g, '').trim());
                    if (cells[0]) {
                        html += `<div class="announcement-item"><span class="badge ${cells[1]||'普通'}">${cells[1]||'普通'}</span> ${cells[0]}</div>`;
                    }
                }
                document.getElementById('marqueeContent').innerHTML = html + html;
                document.getElementById('marqueeBar').style.display = "flex";
            } catch(e) {}
        }

        // 🟢 抓取費用總表
        async function fetchMasterData() {
            try {
                const res = await fetch(urlMaster);
                const csv = await res.text();
                const lines = csv.split("\n").map(l => l.trim()).filter(l => l);
                
                // 索引定位 (依據新截圖)
                // A:月份(0), B:水費(1), L:電總(11), M,N,O,P:電分房(12,13,14,15), V,W,X,Y:房租分房(21,22,23,24)
                masterData = [];
                for(let i = 1; i < lines.length; i++) {
                    const cells = lines[i].split(",").map(c => c.replace(/["'\uFEFF]/g, '').trim());
                    if(cells.length < 15 || cells[0].includes("基準")) continue;

                    const waterTotal = parseFloat(cells[1]) || 0;
                    const eleTotal = parseFloat(cells[11]) || 0;
                    
                    const item = {
                        month: cells[0],
                        waterTotal: waterTotal,
                        waterPerRoom: Math.floor(waterTotal / 4),
                        waterImpute: waterTotal % 4,
                        eleTotal: eleTotal,
                        eleRooms: { "內大": parseFloat(cells[12])||0, "內小": parseFloat(cells[13])||0, "中": parseFloat(cells[14])||0, "外": parseFloat(cells[15])||0 },
                        rentRooms: { "內大": parseFloat(cells[21])||0, "內小": parseFloat(cells[22])||0, "中": parseFloat(cells[23])||0, "外": parseFloat(cells[24])||0 }
                    };
                    masterData.push(item);
                }
                renderHome();
            } catch(e) { document.getElementById('homeContent').innerText = "數據加載失敗，請檢查網路。"; }
        }

        // 🏠 渲染首頁
        function renderHome() {
            const latest = masterData[masterData.length - 1];
            const html = `
                <div class="section-title">當月費用摘要 (${latest.month})</div>
                <div class="stats-grid">
                    <div class="stat-card current-ele" onclick="openRoomDetails('ele')">
                        <div class="stat-label">當月電費 (點擊看各人明細)</div>
                        <div class="stat-value">NT$ ${latest.eleTotal.toLocaleString()}</div>
                        <div class="stat-sub">公基金已自動注資分攤餘額</div>
                    </div>
                    <div class="stat-card current-water" onclick="openRoomDetails('water')">
                        <div class="stat-label">當月水費 (點擊看當月明細)</div>
                        <div class="stat-value">NT$ ${latest.waterTotal.toLocaleString()}</div>
                        <div class="stat-sub">每房實付：NT$ ${latest.waterPerRoom}</div>
                    </div>
                    <div class="stat-card current-total" onclick="openRoomDetails('sum')">
                        <div class="stat-label">當月總和 (點擊看小計)</div>
                        <div class="stat-value">NT$ ${(latest.waterTotal + latest.eleTotal).toLocaleString()}</div>
                    </div>
                </div>
                <div class="section-title">費用趨勢圖 (水電)</div>
                <div class="chart-card"><div class="chart-container"><canvas id="homeChart"></canvas></div></div>
            `;
            document.getElementById('homeContent').innerHTML = html;
            
            new Chart(document.getElementById('homeChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: masterData.map(d => d.month),
                    datasets: [
                        { label: '電費', data: masterData.map(d => d.eleTotal), borderColor: '#d97736', backgroundColor: 'transparent', tension: 0.3 },
                        { label: '水費', data: masterData.map(d => d.waterTotal), borderColor: '#527996', backgroundColor: 'transparent', tension: 0.3 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // 👤 渲染個人資訊區核心邏輯
        function renderPersonalData() {
            const roomKey = document.getElementById('tenantSelector').value;
            const tenant = tenantList.find(t => t.roomKey === roomKey);
            const latest = masterData[masterData.length - 1];
            
            const area = document.getElementById('personalProfileArea');
            
            const myRent = latest.rentRooms[roomKey];
            const myEle = latest.eleRooms[roomKey];
            const myWater = latest.waterPerRoom;
            const myTotal = myRent + myEle + myWater;

            area.innerHTML = `
                <div class="person-profile-header">
                    <div class="profile-name">${tenant.name} <span class="profile-info">(${roomKey})</span></div>
                    <div><span class="violation-badge">⚠️ 違規次數：${tenant.violations} 次</span></div>
                </div>

                <div class="section-title">宿舍房租</div>
                <div class="stats-grid">
                    <div class="stat-card" style="background:#fffaf6">
                        <div class="stat-label">本月房租</div>
                        <div class="stat-value" style="color:#bc6c3a">NT$ ${myRent.toLocaleString()}</div>
                    </div>
                    <div class="stat-card history-card" onclick="openPersonalHistory('rent', '${roomKey}')">
                        <div class="stat-label">歷月房租 (點擊查看)</div>
                        <div class="stat-value">查看紀錄</div>
                    </div>
                </div>

                <div class="section-title">水電費用</div>
                <div class="stats-grid">
                    <div class="stat-card current-water" onclick="openPersonalHistory('water', '${roomKey}')">
                        <div class="stat-label">本月水費</div>
                        <div class="stat-value">NT$ ${myWater.toLocaleString()}</div>
                    </div>
                    <div class="stat-card current-ele" onclick="openPersonalHistory('ele', '${roomKey}')">
                        <div class="stat-label">本月電費</div>
                        <div class="stat-value">NT$ ${myEle.toLocaleString()}</div>
                    </div>
                </div>

                <div class="section-title">個人費用趨勢分析</div>
                <div class="chart-card"><div class="chart-container"><canvas id="personalChart"></canvas></div></div>

                <div class="section-title">📊 彙整費用清單 (月租+水電)</div>
                <div class="summary-table-wrap">
                    <table>
                        <thead>
                            <tr><th>月份</th><th>房租</th><th>水費</th><th>電費</th><th>總計</th></tr>
                        </thead>
                        <tbody>
                            ${masterData.map(d => `
                                <tr>
                                    <td>${d.month}</td>
                                    <td>${d.rentRooms[roomKey].toLocaleString()}</td>
                                    <td>${d.waterPerRoom.toLocaleString()}</td>
                                    <td>${d.eleRooms[roomKey].toLocaleString()}</td>
                                    <td class="total-cell">NT$ ${(d.rentRooms[roomKey] + d.waterPerRoom + d.eleRooms[roomKey]).toLocaleString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            // 個人趨勢圖
            if(personalChartInstance) personalChartInstance.destroy();
            personalChartInstance = new Chart(document.getElementById('personalChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: masterData.map(d => d.month),
                    datasets: [
                        { label: '房租', data: masterData.map(d => d.rentRooms[roomKey]), backgroundColor: '#dfb59a' },
                        { label: '水費', data: masterData.map(d => d.waterPerRoom), backgroundColor: '#a5c0d1' },
                        { label: '電費', data: masterData.map(d => d.eleRooms[roomKey]), backgroundColor: '#d97736' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x:{stacked:true}, y:{stacked:true} } }
            });
        }

        // 分頁切換
        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            event.target.classList.add('active');
            if(page === 'personal') renderPersonalData();
        }

        // 彈窗功能
        function openRoomDetails(type) {
            const latest = masterData[masterData.length-1];
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            
            if(type === 'ele') {
                title.innerText = "當月分房電費明細";
                let html = "";
                Object.keys(latest.eleRooms).forEach(room => {
                    html += `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee;">
                        <span>${tenantMap[room] || room}</span><b>NT$ ${latest.eleRooms[room].toLocaleString()}</b>
                    </div>`;
                });
                body.innerHTML = html;
            } else if(type === 'water') {
                title.innerText = "當月水費計算";
                body.innerHTML = `<div style="padding:10px 0;">全戶總水費：NT$ ${latest.waterTotal}</div>
                                  <div style="padding:10px 0; border-top:1px solid #eee;">每房平均：<b>NT$ ${latest.waterPerRoom}</b></div>
                                  <div class="impute-note">* 餘數 NT$ ${latest.waterImpute} 已由公基金吸收</div>`;
            }
            document.getElementById('detailModal').classList.add('active');
        }

        function openPersonalHistory(type, roomKey) {
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            title.innerText = `${tenantMap[roomKey]} - 歷史${type==='ele'?'電費':type==='water'?'水費':'房租'}紀錄`;
            let html = masterData.map(d => `
                <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #f0f0f0;">
                    <span>${d.month}</span><b>NT$ ${(type==='ele'?d.eleRooms[roomKey]:type==='water'?d.waterPerRoom:d.rentRooms[roomKey]).toLocaleString()}</b>
                </div>
            `).join('');
            body.innerHTML = html;
            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() { document.getElementById('detailModal').classList.remove('active'); }

        startSystem();
    </script>
</body>
</html>
